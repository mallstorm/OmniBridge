name: Orchestration Server Wiring

on:
  push:
    branches:
      - feat/orchestration-engine-v1
    paths:
      - scripts/apply_orchestration_server_wiring.py
      - internal/server/orchestration_adapter.go
      - internal/orchestration/**
      - .github/workflows/orchestration-server-wiring.yml

permissions:
  contents: write

jobs:
  wire-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orchestration-engine-v1
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply server wiring
        run: python3 scripts/apply_orchestration_server_wiring.py
      - name: Format
        run: gofmt -w internal/server/server.go internal/server/orchestration_adapter.go internal/server/orchestration_adapter_test.go internal/orchestration/*.go
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/server/server.go internal/server/orchestration_adapter.go internal/server/orchestration_adapter_test.go internal/orchestration/*.go
          git commit -m "feat(orchestration): wire workflow into data plane"
          git push origin HEAD:feat/orchestration-engine-v1
