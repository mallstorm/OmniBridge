name: Validate OmniBridge

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Go formatting
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem -Path cmd,internal -Recurse -Filter *.go | ForEach-Object { $_.FullName }
          gofmt -w $goFiles
          git diff --stat -- cmd internal
      - name: Regenerate Windows resources
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc = Join-Path (go env GOPATH) 'bin\rsrc.exe'
          foreach ($target in @('accounts','bridge','desktop','setup','tray')) {
            & $rsrc -manifest assets/omnibridge.exe.manifest -ico assets/omnibridge.ico -o ("cmd/{0}/rsrc_windows_amd64.syso" -f $target)
          }
      - name: Go tests
        shell: pwsh
        run: go test ./...
      - name: Race detector
        shell: pwsh
        run: go test -race ./...
      - name: Go vet
        shell: pwsh
        run: go vet ./...
      - name: Vulnerability scan
        continue-on-error: true
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Validate XAML and PowerShell
        shell: pwsh
        run: ./scripts/validate-ui.ps1 -Root $PWD
      - name: Build Windows x64
        shell: pwsh
        run: ./scripts/build-release.ps1 -Root $PWD
      - name: Upload release candidate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OmniBridge-${{ github.sha }}-Windows-x64
          path: dist/*.zip
          retention-days: 7
