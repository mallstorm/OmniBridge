name: Validate OmniBridge

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Regenerate Windows resources
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc = Join-Path (go env GOPATH) 'bin\rsrc.exe'
          & $rsrc -manifest assets/omnibridge.exe.manifest -ico assets/omnibridge.ico -o cmd/bridge/rsrc_windows_amd64.syso
          & $rsrc -manifest assets/omnibridge.exe.manifest -ico assets/omnibridge.ico -o cmd/setup/rsrc_windows_amd64.syso
      - name: Go tests
        shell: pwsh
        run: go test ./...
      - name: Go vet
        shell: pwsh
        run: go vet ./...
      - name: Validate XAML and PowerShell
        shell: pwsh
        run: ./scripts/validate-ui.ps1 -Root $PWD
      - name: Build Windows x64
        shell: pwsh
        run: ./scripts/build-release.ps1 -Root $PWD
      # Rolling policy: preserve two existing artifacts, then upload this run as the third.
      - name: Prune old build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $all = @()
          $page = 1
          do {
            $uri = "https://api.github.com/repos/$env:GH_REPO/actions/artifacts?per_page=100&page=$page"
            $resp = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            $batch = @($resp.artifacts)
            $all += $batch
            $page++
          } while ($batch.Count -eq 100)

          $ordered = @($all | Where-Object { -not $_.expired } | Sort-Object {[datetime]$_.created_at} -Descending)
          $toDelete = @($ordered | Select-Object -Skip 2)
          Write-Host "Artifacts found: $($ordered.Count); deleting: $($toDelete.Count); preserving before upload: $([Math]::Min(2, $ordered.Count))"
          foreach ($artifact in $toDelete) {
            $deleteUri = "https://api.github.com/repos/$env:GH_REPO/actions/artifacts/$($artifact.id)"
            Invoke-RestMethod -Uri $deleteUri -Headers $headers -Method Delete
            Write-Host "Deleted artifact $($artifact.id): $($artifact.name)"
          }
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: OmniBridge-${{ github.sha }}-Windows-x64
          path: dist/*.zip
          retention-days: 14
