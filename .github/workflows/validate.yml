name: Validate OmniBridge

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Go formatting gate
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem -Path cmd,internal -Recurse -Filter *.go | ForEach-Object { $_.FullName }
          gofmt -w $goFiles
          git diff --exit-code -- cmd internal
      - name: Regenerate Windows resources
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc = Join-Path (go env GOPATH) 'bin\rsrc.exe'
          foreach ($target in @('accounts','bridge','desktop','setup','tray')) {
            & $rsrc -manifest assets/omnibridge.exe.manifest -ico assets/omnibridge.ico -o ("cmd/{0}/rsrc_windows_amd64.syso" -f $target)
          }
      - name: Go tests
        shell: pwsh
        run: go test ./...
      - name: Race detector
        shell: pwsh
        run: go test -race ./...
      - name: Go vet
        shell: pwsh
        run: go vet ./...
      - name: Vulnerability gate
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Validate XAML and PowerShell
        shell: pwsh
        run: ./scripts/validate-ui.ps1 -Root $PWD
      - name: Windows PowerShell 5.1 acceptance
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          ./scripts/validate-ui.ps1 -Root $PWD
          go test ./internal/secretstore -run DPAPI -count=1 -v
      - name: Build Windows x64
        shell: pwsh
        run: ./scripts/build-release.ps1 -Root $PWD
      - name: Upload release candidate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OmniBridge-${{ github.sha }}-Windows-x64
          path: dist/*.zip
          retention-days: 7
