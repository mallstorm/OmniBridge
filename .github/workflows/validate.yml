name: Validate OmniBridge

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Regenerate Windows resources
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc = Join-Path (go env GOPATH) 'bin\rsrc.exe'
          & $rsrc -manifest assets/omnibridge.exe.manifest -ico assets/omnibridge.ico -o cmd/bridge/rsrc_windows_amd64.syso
          & $rsrc -manifest assets/omnibridge.exe.manifest -ico assets/omnibridge.ico -o cmd/setup/rsrc_windows_amd64.syso
      - name: Go tests
        shell: pwsh
        run: go test ./...
      - name: Go vet
        shell: pwsh
        run: go vet ./...
      - name: Validate XAML and PowerShell
        shell: pwsh
        run: ./scripts/validate-ui.ps1 -Root $PWD
      - name: Build Windows x64
        shell: pwsh
        run: ./scripts/build-release.ps1 -Root $PWD
      - name: Upload release candidate
        id: release_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OmniBridge-${{ github.sha }}-Windows-x64
          path: dist/*.zip
      - name: Report artifact storage limitation
        if: steps.release_artifact.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning 'Release build succeeded, but GitHub artifact upload failed. Check Actions artifact storage quota.'
          '### Artifact upload warning' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'Release validation and Windows x64 build succeeded, but the release ZIP could not be uploaded to GitHub Actions artifact storage.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
