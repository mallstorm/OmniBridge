name: Team Routing gofmt once

on:
  push:
    branches:
      - codex/rc8-team-routing
    paths:
      - .github/workflows/team-gofmt-once.yml

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rc8-team-routing
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache: false
      - name: Apply gofmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find cmd internal -type f -name '*.go' -print | sort)
          gofmt -w "${files[@]}"
          git diff --check
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cmd internal; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd internal
          git commit -m "style: gofmt Team Routing sources"
          git push origin HEAD:codex/rc8-team-routing
