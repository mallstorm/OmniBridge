name: Expand OmniBridge RC5 source into main

on:
  push:
    paths:
      - '.github/workflows/expand-rc5.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand validated RC5 source into repository root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'archives/OmniBridge_1.0.0-rc5_SOURCE.zip'
          $migration = Join-Path $PWD '.migration'
          Expand-Archive -LiteralPath $archive -DestinationPath $migration -Force
          $src = Join-Path $migration 'OmniBridge_1.0.0-rc5_SOURCE'
          if (-not (Test-Path -LiteralPath (Join-Path $src 'go.mod'))) {
            throw 'RC5 source root not found or go.mod is missing.'
          }
          Get-ChildItem -LiteralPath $src -Force | ForEach-Object {
            $destination = Join-Path $PWD $_.Name
            if ($_.PSIsContainer) {
              if (-not (Test-Path -LiteralPath $destination)) {
                New-Item -ItemType Directory -Path $destination | Out-Null
              }
              Get-ChildItem -LiteralPath $_.FullName -Force | ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination $destination -Recurse -Force
              }
            } else {
              Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
            }
          }
          # GitHub Actions token may write repository contents, but it cannot create/update
          # workflow files without the separate workflows permission. Add the root CI file
          # through the connected GitHub API after this migration succeeds.
          $rootWorkflow = Join-Path $PWD '.github/workflows/validate.yml'
          if (Test-Path -LiteralPath $rootWorkflow) {
            Remove-Item -LiteralPath $rootWorkflow -Force
          }
          Remove-Item -LiteralPath $migration -Recurse -Force
      - name: Commit expanded source tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'Nothing to commit.'
            exit 0
          }
          git commit -m 'Expand OmniBridge 1.0.0 RC5 source in repository root'
          git push origin HEAD:main
